events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    server {
        listen 3001;
        server_name  localhost;

        # The build lives under /site/ (Vite base, see vite.config.ts).
        # Hashed, content-addressed build output (Vite's dist/assets) —
        # safe to cache forever.
        location /site/assets/ {
            root   /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback so client-side routes (react-router) resolve on a
        # hard refresh or direct link, e.g. /site/events.
        location /site/ {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /site/index.html;
        }

        location = / {
            return 302 /site/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
