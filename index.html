    <!-- Same brand-kit favicons as the admin (app.our-venues.com). Paths are
         absolute from public/ — Vite prefixes them with base ("/site/") on build.
         The manifest's own icon paths are relative to it, and it has no fixed
         start_url: the site runs at "/" on subdomains and at
         "/celebrations/{guid}" on the permanent link. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>o-gamos-mas.com</title>
  </head>
